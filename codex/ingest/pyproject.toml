[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ingest"
version = "0.1.0"
description = "Codex documentation ingest CLI"
requires-python = ">=3.13"
dependencies = [
    "click>=8.0",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
spa = ["playwright>=1.40"]
local = ["mkdocs>=1.5", "mkdocs-material>=9.0"]

[project.scripts]
ingest = "ingest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
