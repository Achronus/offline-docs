# Codex now stages each source's native HTML under <site_root>/static/sources/<name>/
# for iframe-based rendering. No MDX conversion is performed.
site_root: ./site

sources:
  jax:
    type: sphinx-html
    url: https://docs.jax.dev/en/latest/
    download_url: https://docs.jax.dev/_/downloads/en/latest/htmlzip/
    version: "0.6.1"
    color: "#1D9E75"
    tag: "Jx"

  flax:
    type: sphinx-html
    url: https://flax.readthedocs.io/en/latest/
    version: "0.10.4"
    color: "#534AB7"
    tag: "Fl"

  optax:
    type: sphinx-html
    url: https://optax.readthedocs.io/en/latest/
    version: "0.2.5"
    color: "#D85A30"
    tag: "Ox"

  orbax:
    type: sphinx-html
    url: https://orbax.readthedocs.io/en/latest/
    version: "0.1.9"
    color: "#185FA5"
    tag: "Ob"

  mujoco:
    type: sphinx-html
    url: https://mujoco.readthedocs.io/en/stable/
    version: "3.3.0"
    color: "#993556"
    tag: "Mj"

  mkdocs-material:
    type: mkdocs
    url: https://squidfunk.github.io/mkdocs-material/
    version: "9.6"
    color: "#639922"
    tag: "Mk"

  fastapi:
    type: mkdocs
    url: https://fastapi.tiangolo.com/
    version: "0.115"
    color: "#1D9E75"
    tag: "Fa"
    # Skip language-translated paths (/zh/, /ja/, /uk/, /zh-hant/, /pt-br/, ...).
    # English lives at the root, not behind a language prefix.
    # The regex matches any leading 2-letter code optionally followed by a
    # locale modifier; real doc dirs like /how-to/ start with 3+ letters so
    # they're safe.
    exclude_pattern: "^/[a-z]{2}(-[a-z]+)?/"

  envrax:
    type: mkdocs-local
    # Relative to this codex.yaml. Drop the repo under codex/sources/envrax/.
    repo_path: ./sources/envrax
    version: "0.3.1"
    color: "#854F0B"
    tag: "Ev"

  mujorax:
    type: mkdocs-local
    repo_path: ./sources/mujorax
    version: "0.2.0"
    color: "#854F0B"
    tag: "Mr"

  nextjs:
    type: spa
    url: https://nextjs.org/docs
    version: "15.2"
    color: "#444441"
    tag: "Nx"
    crawl:
      start_paths: ["/docs"]
      # Match /docs and anything below; the trailing slash on /docs is optional
      # since Next.js's links sometimes lack it.
      url_pattern: "^/docs(/|$)"
      content_selector: "main"

  react:
    type: spa
    url: https://react.dev
    version: "19.1"
    color: "#378ADD"
    tag: "Re"
    # Upstream only offers a 32x32 transparent or 180x180 apple-touch (with
    # brand bg). Curate a high-res transparent atom mark instead.
    icon: /img/source-icons/react.svg
    crawl:
      start_paths: ["/learn", "/reference/react"]
      url_pattern: "^/(learn|reference/react)"
      content_selector: "main"

